# ==============================================================================
# Configuración Nginx para COMESIS (HTTP 80 + HTTPS 443 con SSL)
# ==============================================================================

# 1. Servidor HTTP (Redirige a HTTPS o responde directamente)
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.3.249 localhost;

    # Si deseas forzar redirección estricta a HTTPS, descomenta la siguiente línea:
    # return 301 https://$host$request_uri;

    root /var/www/comesis/public;
    index index.php index.html;

    client_max_body_size 64M;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# 2. Servidor HTTPS (Puerto 443 con SSL para taquillas en la red)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 192.168.3.249 localhost;

    root /var/www/comesis/public;
    index index.php index.html;

    # Certificados SSL
    ssl_certificate /etc/ssl/comesis/comesis.crt;
    ssl_certificate_key /etc/ssl/comesis/comesis.key;

    # Protocolos y Cifrados Seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 64M;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
